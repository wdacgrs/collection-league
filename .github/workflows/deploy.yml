name: Deploy
# main    -> production Worker (CF_WORKER_NAME, production D1)
# develop -> preview Worker (<CF_WORKER_NAME>-preview, preview D1)
#
# Deploy targets come from repository variables (see cloudflare.config.ts);
# unset variables fall back to upstream production values. The develop/preview
# deploy only runs when CF_D1_PREVIEW_ID is configured, so repos without a
# preview database never deploy develop.
on:
  push:
    branches:
      - main
      - develop
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy to Cloudflare Workers (${{ github.ref_name == 'main' && 'production' || 'preview' }})
    if: github.ref_name == 'main' || vars.CF_D1_PREVIEW_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_NAME: ${{ vars.CF_D1_NAME }}
      CF_D1_ID: ${{ vars.CF_D1_ID }}
      CF_D1_PREVIEW_NAME: ${{ vars.CF_D1_PREVIEW_NAME }}
      CF_D1_PREVIEW_ID: ${{ vars.CF_D1_PREVIEW_ID }}
      # Whether this run targets production (main) or preview (any other branch).
      # Kept as a separate flag so the value selections below never rely on an
      # empty string as a ternary operand — in GitHub Actions expressions `''`
      # is falsy, so `X && '' || '--preview'` wrongly yields '--preview' even on
      # main. Compare against this explicit boolean instead.
      IS_PRODUCTION: ${{ github.ref_name == 'main' }}
      # Migrations target the database bound to the Worker being deployed.
      MIGRATE_D1_ID: ${{ github.ref_name == 'main' && secrets.D1_DATABASE_ID || vars.CF_D1_PREVIEW_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Apply D1 migrations
        run: npx cf d1 migrations apply "$MIGRATE_D1_ID" --dir drizzle
      - name: Build & deploy (production)
        if: env.IS_PRODUCTION == 'true'
        run: npm run deploy:vinext
      - name: Build & deploy (preview)
        if: env.IS_PRODUCTION != 'true'
        run: npm run deploy:vinext -- --preview
